<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Password generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --page:#E4EAEC; --ink:#14213D; --muted:#4A5A6E; --line:#B7C3CA;
  --rack:#14213D; --edge:rgba(8,14,30,.45);
  --btn:#14213D; --btn-ink:#F3EFE2; --focus:#2E4BD1;
  --low:#F3EFE2; --low-ink:#14213D; --up:#2E4BD1; --up-ink:#fff;
  --dig:#F2B33D; --dig-ink:#14213D; --sym:#E4472F; --sym-ink:#fff;
  --t:3rem;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --page:#0F1A26; --ink:#E4EAEC; --muted:#9FB0BE; --line:#2A3C4E;
    --rack:#060B12; --edge:rgba(0,0,0,.55);
    --btn:#F3EFE2; --btn-ink:#14213D; --focus:#8EA2FF;
  }
}
:root[data-theme="dark"]{
  --page:#0F1A26; --ink:#E4EAEC; --muted:#9FB0BE; --line:#2A3C4E;
  --rack:#060B12; --edge:rgba(0,0,0,.55);
  --btn:#F3EFE2; --btn-ink:#14213D; --focus:#8EA2FF;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;background:var(--page);color:var(--ink)}
body{font-family:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:1.0625rem;line-height:1.5;-webkit-font-smoothing:antialiased}
main{max-width:980px;margin:0 auto;padding:clamp(1.5rem,5vw,4rem) clamp(1rem,4vw,2rem) 4rem}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px}

h1{font-size:clamp(2.2rem,6vw,3.6rem);line-height:1;letter-spacing:-.035em;font-weight:760;margin:0 0 .6rem}
.sub{margin:0 0 2.2rem;max-width:46ch;color:var(--muted)}

/* ---- tiles ---- */
.tile{position:relative;display:inline-grid;place-items:center;width:var(--t);height:calc(var(--t)*1.22);
  border-radius:7px;box-shadow:0 4px 0 var(--edge);
  font:700 calc(var(--t)*.56)/1 'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;user-select:none}
.tile[data-k=low]{background:var(--low);color:var(--low-ink)}
.tile[data-k=up]{background:var(--up);color:var(--up-ink)}
.tile[data-k=dig]{background:var(--dig);color:var(--dig-ink)}
.tile[data-k=sym]{background:var(--sym);color:var(--sym-ink)}
/* corner marks so class never depends on colour alone */
.tile[data-k=up]::after,.tile[data-k=dig]::after,.tile[data-k=sym]::after{content:"";position:absolute;top:calc(var(--t)*.1);right:calc(var(--t)*.1);background:currentColor;opacity:.75}
.tile[data-k=up]::after{width:calc(var(--t)*.26);height:calc(var(--t)*.07);border-radius:2px}
.tile[data-k=dig]::after{width:calc(var(--t)*.12);height:calc(var(--t)*.12);border-radius:50%}
.tile[data-k=sym]::after{width:calc(var(--t)*.13);height:calc(var(--t)*.13);transform:rotate(45deg)}

/* ---- the rack ---- */
.rack{--t:3.2rem;display:flex;flex-wrap:wrap;gap:10px;align-content:flex-start;
  min-height:calc(var(--t)*1.22*2 + 10px + 3.2rem);
  background:var(--rack);border-radius:20px;padding:clamp(1rem,3vw,1.7rem) clamp(1rem,3vw,1.7rem) calc(clamp(1rem,3vw,1.7rem) + 6px);
  box-shadow:inset 0 8px 16px rgba(0,0,0,.5),inset 0 -2px 0 rgba(255,255,255,.07)}
.rack[data-s=m]{--t:2.6rem;gap:8px}
.rack[data-s=s]{--t:2.1rem;gap:6px}
@media (max-width:520px){.rack{--t:2.5rem;gap:7px}.rack[data-s=m]{--t:2.2rem}.rack[data-s=s]{--t:1.8rem;gap:5px}}
.rack.drop .tile{animation:seat .45s cubic-bezier(.2,.9,.3,1.15) both;animation-delay:calc(var(--i)*16ms)}
@keyframes seat{from{opacity:0;transform:translateY(-1.4rem) rotate(calc(var(--r)*1deg))}to{opacity:1;transform:none}}

.actions{display:flex;flex-wrap:wrap;align-items:center;gap:.8rem;margin-top:1.5rem}
.btn{font:inherit;font-weight:700;cursor:pointer;padding:.8rem 1.4rem;border-radius:10px;border:2px solid var(--btn);
  background:var(--btn);color:var(--btn-ink);box-shadow:0 3px 0 var(--edge);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--edge)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--ink)}
#status{color:var(--muted);min-height:1.5em}

/* ---- controls ---- */
.controls{display:grid;gap:2.5rem;margin-top:3.2rem;padding-top:2.2rem;border-top:2px solid var(--line)}
@media (min-width:760px){.controls{grid-template-columns:1fr 1.15fr;gap:4rem}}
label,legend{font-weight:700;padding:0}
fieldset{border:0;margin:0;padding:0;min-width:0}
.len-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:1rem}
output{font:700 2.4rem/1 'JetBrains Mono',ui-monospace,monospace;letter-spacing:-.04em}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:30px;background:transparent;cursor:pointer;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:var(--line)}
input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:var(--line)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:30px;margin-top:-12px;border-radius:6px;background:var(--ink);border:0;box-shadow:0 3px 0 var(--edge)}
input[type=range]::-moz-range-thumb{width:22px;height:30px;border-radius:6px;background:var(--ink);border:0;box-shadow:0 3px 0 var(--edge)}
.ends{display:flex;justify-content:space-between;color:var(--muted);font-size:.9rem;margin-top:.2rem}

.kinds{display:grid;grid-template-columns:1fr 1fr;gap:.9rem 1.2rem;margin-top:1rem}
@media (max-width:420px){.kinds{grid-template-columns:1fr}}
.chip{--t:2.3rem;display:flex;align-items:center;gap:.8rem;text-align:left;font:inherit;color:var(--ink);cursor:pointer;
  background:none;border:0;padding:.3rem;border-radius:12px}
.chip[aria-disabled=true]{cursor:default}
.chip b{display:block;line-height:1.2}
.chip span+span{color:var(--muted);font-size:.92rem;line-height:1.25}
.chip[aria-pressed=false] .tile{background:transparent;color:var(--muted);box-shadow:inset 0 0 0 2px var(--line)}
.chip[aria-pressed=false] .tile::after{display:none}
.chip[aria-pressed=false] b{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1.5px}

/* ---- verdict ---- */
.verdict{margin-top:3rem;display:grid;gap:1.6rem}
@media (min-width:760px){.verdict{grid-template-columns:1fr 1.15fr;gap:4rem;align-items:end}}
.tier{font-size:clamp(1.8rem,4.5vw,2.6rem);font-weight:760;letter-spacing:-.03em;line-height:1.05;margin:0 0 1rem}
.gauge{position:relative;height:14px;border-radius:7px;background:var(--line);margin-bottom:1.5rem}
.fill{height:100%;border-radius:7px;background:var(--sym);width:0;transition:width .35s ease,background-color .35s}
.tick{position:absolute;top:-4px;width:2px;height:22px;background:var(--ink);opacity:.55}
.tick i{position:absolute;top:26px;left:50%;transform:translateX(-50%);font:normal 600 .8rem 'JetBrains Mono',ui-monospace,monospace;color:var(--muted)}
.why{margin:0;color:var(--muted);max-width:52ch}
.why strong{color:var(--ink)}

/* ---- terminal ---- */
.cli{margin-top:3.5rem;padding-top:2rem;border-top:2px solid var(--line)}
.cli h2{font-size:1.15rem;margin:0 0 .3rem}
.cli p{margin:0 0 1rem;color:var(--muted);max-width:56ch}
.cmd{display:flex;flex-wrap:wrap;gap:.8rem;align-items:center}
code{font:500 1rem 'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;background:var(--rack);color:#F3EFE2;padding:.7rem 1rem;border-radius:10px;overflow-x:auto;max-width:100%}
.cmd .btn{padding:.6rem 1rem;font-size:.95rem}

@media (prefers-reduced-motion:reduce){.rack.drop .tile{animation:none}.fill{transition:none}.btn{transition:none}}
</style>
</head>
<body>
<main>
  <h1>Password generator</h1>
  <p class="sub">Made in this tab with your device's secure random source. Nothing is sent or saved.</p>

  <section aria-label="Generated password">
    <div class="rack" id="rack" data-s="l" role="img" aria-label=""></div>
    <div class="actions">
      <button class="btn" id="gen" type="button">Generate new</button>
      <button class="btn ghost" id="copy" type="button">Copy password</button>
      <span id="status" role="status" aria-live="polite"></span>
    </div>
  </section>

  <section class="controls">
    <div>
      <div class="len-head"><label for="len">Length</label><output id="lenOut" for="len">16</output></div>
      <input type="range" id="len" min="4" max="64" value="16">
      <div class="ends"><span>4</span><span>64</span></div>
    </div>
    <fieldset>
      <legend>Characters in the mix</legend>
      <div class="kinds">
        <button class="chip" type="button" data-k="low" aria-pressed="true" aria-disabled="true"><span class="tile" data-k="low">a</span><span><b>Lowercase</b><span>a–z, always on</span></span></button>
        <button class="chip" type="button" data-k="up" aria-pressed="true"><span class="tile" data-k="up">A</span><span><b>Uppercase</b><span>A–Z</span></span></button>
        <button class="chip" type="button" data-k="dig" aria-pressed="true"><span class="tile" data-k="dig">7</span><span><b>Digits</b><span>0–9</span></span></button>
        <button class="chip" type="button" data-k="sym" aria-pressed="true"><span class="tile" data-k="sym">#</span><span><b>Symbols</b><span>!@#$%^&amp;*</span></span></button>
      </div>
    </fieldset>
  </section>

  <section class="verdict" aria-live="polite">
    <div>
      <p class="tier" id="tier">Strong</p>
      <div class="gauge" aria-hidden="true">
        <div class="fill" id="fill"></div>
        <span class="tick" style="left:31.25%"><i>40</i></span>
        <span class="tick" style="left:46.9%"><i>60</i></span>
        <span class="tick" style="left:78.1%"><i>100</i></span>
      </div>
    </div>
    <p class="why" id="why"></p>
  </section>

  <section class="cli">
    <h2>Same settings in your terminal</h2>
    <p>Run these with the Python tool, <code style="padding:.1rem .4rem;font-size:.9rem">password_gen.py</code>. Add <code style="padding:.1rem .4rem;font-size:.9rem">-c</code> to copy the result.</p>
    <div class="cmd"><code id="cmd"></code><button class="btn ghost" id="copyCmd" type="button">Copy command</button></div>
  </section>
</main>

<script>
(function(){
  var $=function(s){return document.querySelector(s)};
  var SETS={low:'abcdefghijklmnopqrstuvwxyz',up:'ABCDEFGHIJKLMNOPQRSTUVWXYZ',dig:'0123456789',sym:'!@#$%^&*()-_=+[]{};:,.<>?/'};
  var on={low:true,up:true,dig:true,sym:true};
  var len=16, password='', timer;

  /* Unbiased secure integer in [0,n): rejection sampling over crypto.getRandomValues */
  function randInt(n){
    var lim=Math.floor(4294967296/n)*n, a=new Uint32Array(1), x;
    do{crypto.getRandomValues(a);x=a[0]}while(x>=lim);
    return x%n;
  }
  function pick(arr){return arr[randInt(arr.length)]}
  function shuffle(a){for(var i=a.length-1;i>0;i--){var j=randInt(i+1),t=a[i];a[i]=a[j];a[j]=t}return a}

  /* Same algorithm as the Python CLI: one from every active pool, fill, shuffle */
  function make(){
    var ks=Object.keys(SETS).filter(function(k){return on[k]});
    var all=[]; ks.forEach(function(k){SETS[k].split('').forEach(function(ch){all.push({ch:ch,k:k})})});
    var out=ks.map(function(k){return {ch:pick(SETS[k].split('')),k:k}});
    while(out.length<len) out.push(pick(all));
    return {items:shuffle(out),size:all.length};
  }

  function render(r,animate){
    var rack=$('#rack'); rack.replaceChildren();
    rack.dataset.s=len>40?'s':len>24?'m':'l';
    rack.classList.toggle('drop',animate);
    r.items.forEach(function(it,i){
      var s=document.createElement('span');
      s.className='tile'; s.dataset.k=it.k; s.textContent=it.ch;
      s.style.setProperty('--i',Math.min(i,40));
      s.style.setProperty('--r',(randInt(13)-6));
      rack.appendChild(s);
    });
    password=r.items.map(function(i){return i.ch}).join('');
    rack.setAttribute('aria-label','Password: '+password);
  }

  var Y=31557600;
  function n(v,w){var r=Math.max(1,Math.round(v));return 'about '+r.toLocaleString()+' '+w+(r===1?'':'s')}
  function span(sec){
    if(sec<1) return 'less than a second';
    if(sec<60) return n(sec,'second');
    if(sec<3600) return n(sec/60,'minute');
    if(sec<86400) return n(sec/3600,'hour');
    if(sec<Y) return n(sec/86400,'day');
    var y=sec/Y;
    if(y>1.38e10) return 'longer than the universe has existed (about 13.8 billion years)';
    if(y<1e3) return n(y,'year');
    if(y<1e6) return n(y/1e3,'thousand year');
    if(y<1e9) return n(y/1e6,'million year');
    return n(y/1e9,'billion year');
  }

  function verdict(size){
    var bits=len*Math.log2(size);
    var tier,col;
    if(bits<40){tier='Weak';col='var(--sym)'}
    else if(bits<60){tier='Fair';col='var(--dig)'}
    else if(bits<100){tier='Strong';col='var(--up)'}
    else{tier='Very strong';col='var(--up)'}
    $('#tier').textContent=tier;
    var f=$('#fill'); f.style.width=Math.min(bits/128,1)*100+'%'; f.style.background=col;
    var sec=Math.pow(2,bits-1)/1e10;
    $('#why').innerHTML='<strong>'+Math.round(bits)+' bits of entropy.</strong> Each position draws from '+size+' characters. At 10 billion guesses a second, cracking this would take '+span(sec)+'.';
  }

  function command(){
    var c='python password_gen.py -l '+len;
    if(!on.sym)c+=' -s'; if(!on.dig)c+=' -n'; if(!on.up)c+=' -u';
    $('#cmd').textContent=c;
  }

  function run(animate){var r=make();render(r,animate);verdict(r.size);command()}

  function flash(msg){var s=$('#status');s.textContent=msg;clearTimeout(timer);timer=setTimeout(function(){s.textContent=''},2600)}

  function copyText(t){
    function fallback(){
      var ta=document.createElement('textarea');ta.value=t;ta.setAttribute('readonly','');
      ta.style.cssText='position:fixed;top:0;opacity:0';document.body.appendChild(ta);ta.select();
      var ok=false;try{ok=document.execCommand('copy')}catch(e){}
      ta.remove();return Promise.resolve(ok);
    }
    if(navigator.clipboard&&navigator.clipboard.writeText){
      return navigator.clipboard.writeText(t).then(function(){return true},fallback);
    }
    return fallback();
  }

  $('#gen').addEventListener('click',function(){run(true)});
  $('#copy').addEventListener('click',function(){
    copyText(password).then(function(ok){flash(ok?'Password copied.':'Your browser blocked copying. Select the password and copy it by hand.')});
  });
  $('#copyCmd').addEventListener('click',function(){
    copyText($('#cmd').textContent).then(function(ok){flash(ok?'Command copied.':'Your browser blocked copying.')});
  });
  $('#len').addEventListener('input',function(e){
    len=+e.target.value; $('#lenOut').textContent=len; run(false);
  });
  document.querySelectorAll('.chip').forEach(function(b){
    b.addEventListener('click',function(){
      var k=b.dataset.k; if(k==='low')return;
      on[k]=!on[k]; b.setAttribute('aria-pressed',on[k]); run(true);
    });
  });

  run(true);
})();
</script>
</body>
</html>
